services:
  client:
    build: 
      context: https://github.com/danielpredel/predel-blog-client.git
    container_name: predel_angular_client
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: 
      context: https://github.com/danielpredel/predel-blog-api.git
    container_name: predel_express_api
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: predel_mongo_db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
